spring:
  datasource:
    # Modo PostgreSQL: os testes rodam as mesmas migrações do Flyway que o banco real
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  secret: test-only-secret-key-with-at-least-32-characters-0123456789
  expiration: 3600000

whatsapp:
  enabled: false
