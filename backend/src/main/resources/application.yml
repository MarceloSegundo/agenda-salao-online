spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:agendadb}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [traceId=%X{traceId:-}] %msg%n"

whatsapp:
  api-url: ${WHATSAPP_API_URL:http://localhost:3000}
  enabled: ${WHATSAPP_ENABLED:true}

jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyThatIsAtLeast32CharactersLongAndVerySecure}
  expiration: ${JWT_EXPIRATION:86400000}
